# One entry per line, no wildcards: a blanket ignore hides dead dependencies.
# Everything listed here was grepped for and is genuinely referenced somewhere
# depcheck cannot see (a config value, a tsconfig `extends`, or a peer range).
ignores:
  # listed in .storybook/main.ts `addons`; addon-docs is also imported by
  # src/stories/Introduction.mdx, which depcheck cannot parse
  - "@storybook/addon-docs"
  - "@storybook/addon-links"
  # `extends` target of tsconfig.json
  - "@just-web/repo-scripts"
  # peer dependency of @testing-library/react, declared so pnpm resolves one copy
  - "@testing-library/dom"
  # postcss.config.js plugin entries
  - autoprefixer
  - postcss
  - tailwindcss
  # test.environment in vitest.config.mts
  - jsdom
  # rimraf 6 declares `bin` as a string, which depcheck cannot map to a name
  - rimraf
