packages:
  - apps/*
  - components/*
  - frameworks/*
  - libraries/*
  - plugins/*
  - presets/*
  - react/*
  - solid/*
  - tools/*
allowBuilds:
  esbuild: true
  fsevents: true
peerDependencyRules:
  allowedVersions:
    # react-codemirror2-react-17 is a react-17 fork of react-codemirror2 whose
    # peer range was never widened. It uses no react-17-only API.
    'react-codemirror2-react-17>react': '18'
overrides:
  typescript: '~5.9.3'
  # Transitive dev-tooling advisories. Every parent below is already at its
  # latest release, so bumping a direct dependency reaches none of them.
  # Added 2026-09-01; drop each entry once the parent ships a patched range.
  # shell-quote  GHSA critical, via npm-run-all2@6 (pulled by @just-web/repo-scripts)
  shell-quote: '>=1.8.4 <2'
  # fast-uri     via ajv@8 under @commitlint/config-validator@21
  fast-uri: '>=3.1.5 <4'
  # js-yaml      two majors in the tree; both need their own patched floor
  js-yaml@3: '>=3.15.1 <4'
  js-yaml@4: '>=4.3.1 <5'
  # brace-expansion  three majors in the tree
  brace-expansion@1: '>=1.1.16 <2'
  brace-expansion@2: '>=2.1.2 <3'
  brace-expansion@5: '>=5.0.7 <6'
  # minimatch    only the 9.x copy is affected
  minimatch@9: '>=9.0.7 <10'
  # @babel/core  low severity, reached through babel-preset-solid and react-docgen
  '@babel/core': '>=7.29.6 <8'

# Supply-chain soak: refuse packages published less than 24h ago, so a compromised
# release has a window to be caught and unpublished before it reaches a build.
#
# This must live here, not in .npmrc. pnpm only auto-enables STRICT soak mode when
# the setting comes from pnpm-workspace.yaml / config.yaml / CLI / env; a value in
# .npmrc runs in LOOSE mode, where a too-young package is silently appended to
# minimumReleaseAgeExclude and installed anyway. minimumReleaseAgeStrict is set
# explicitly so the enforcement does not depend on that inference.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
