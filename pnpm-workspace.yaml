packages:
  - apps/*
  - components/*
  - frameworks/*
  - libraries/*
  - plugins/*
  - presets/*
  - react/*
  - solid/*
  - tools/*
allowBuilds:
  esbuild: true
  fsevents: true
peerDependencyRules:
  allowedVersions:
    # react-codemirror2-react-17 is a react-17 fork of react-codemirror2 whose
    # peer range was never widened. It uses no react-17-only API.
    'react-codemirror2-react-17>react': '18'
overrides:
  typescript: '~5.9.3'
